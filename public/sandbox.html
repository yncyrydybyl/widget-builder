<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <!--
            Where generated apps run. The builder frames this page with
            sandbox="allow-scripts" (an opaque origin: no access to the builder,
            its storage or the Widget API) and sends it the app's HTML, which
            replaces this document. This policy stays in force for the app:
            inline code only, no network at all.
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; form-action 'none'; base-uri 'none'"
        />
    </head>
    <body>
        <script>
            addEventListener("message", function load(e) {
                if (e.source !== parent || !e.data || typeof e.data.__miniappLoad !== "string") return;
                removeEventListener("message", load);
                document.open();
                document.write(e.data.__miniappLoad);
                document.close();
            });
            parent.postMessage({ __miniapp: true, kind: "sandbox-ready" }, "*");
        </script>
    </body>
</html>

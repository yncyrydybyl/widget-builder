<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>App</title>
</head>
<body>
<h1>App</h1>
<div class="card stack">
  <p><button id="hello">Say hello</button></p>
  <div class="row" id="faces"></div>
  <p class="muted" id="log"></p>
</div>
<script>
  const greeted = []; // user ids, in order

  miniapp.on((ev) => {
    if (ev.data && ev.data.hello) greeted.push(ev.sender);
    render();
  });

  document.getElementById("hello").onclick = () => miniapp.send({ hello: true });

  function render() {
    document.getElementById("faces").replaceChildren(...greeted.map((id) => miniapp.avatar(id)));
    document.getElementById("log").textContent = greeted.length ? "Hello from " + greeted.map(miniapp.displayName).join(", ") : "Nobody said hello yet.";
  }

  miniapp.ready(render);
</script>
</body>
</html>

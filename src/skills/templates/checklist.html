<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shared checklist</title>
<style>
  li.done .grow { text-decoration: line-through; color: var(--muted); }
</style>
</head>
<body>
<h1 id="heading">Shared checklist</h1>
<form class="row" id="add">
  <input id="text" type="text" placeholder="New item" aria-label="New item" maxlength="200">
  <button type="submit">Add</button>
</form>
<ul class="list card" id="list"></ul>
<p class="empty" id="empty">Nothing on the list yet.</p>
<script>
  // Settings: a new app of this kind changes only this line.
  const SETTINGS = {"title":"Shared checklist","placeholder":"New item","button":"Add"};
  document.getElementById("heading").textContent = SETTINGS.title;
  document.getElementById("text").placeholder = SETTINGS.placeholder;
  document.getElementById("text").setAttribute("aria-label", SETTINGS.placeholder);
  document.querySelector("#add button").textContent = SETTINGS.button;

  const items = new Map(); // event id -> { text, done, by }

  miniapp.on((ev) => {
    const d = ev.data || {};
    if (typeof d.add === "string") items.set(ev.id, { text: d.add, done: false, by: ev.sender });
    if (d.toggle && items.has(d.toggle)) items.get(d.toggle).done = !!d.done;
    if (d.remove) items.delete(d.remove);
    render();
  });

  document.getElementById("add").onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById("text");
    const text = input.value.trim();
    if (text) miniapp.send({ add: text });
    input.value = "";
  };

  function render() {
    const list = document.getElementById("list");
    list.textContent = "";
    list.hidden = items.size === 0;
    document.getElementById("empty").hidden = items.size > 0;
    for (const [id, item] of items) {
      const li = document.createElement("li");
      li.className = item.done ? "done" : "";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = item.done;
      box.setAttribute("aria-label", item.text);
      box.onchange = () => miniapp.send({ toggle: id, done: box.checked });
      const text = document.createElement("span");
      text.className = "grow";
      text.textContent = item.text;
      const del = document.createElement("button");
      del.className = "ghost";
      del.textContent = "✕";
      del.setAttribute("aria-label", "Remove " + item.text);
      del.onclick = () => miniapp.send({ remove: id });
      li.append(box, text, miniapp.avatar(item.by), del);
      list.append(li);
    }
  }

  miniapp.ready(render);
</script>
</body>
</html>

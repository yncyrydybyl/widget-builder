<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Countdown</title>
<style>
  #left { grid-template-columns: repeat(4, 1fr); margin: 8px 0 12px; }
  #left .big { font-size: 34px; }
  form.row { justify-content: center; margin-top: 16px; }
</style>
</head>
<body class="center">
<h1 id="title">Release</h1>
<div class="grid" id="left"></div>
<p class="big appear" id="done" hidden>🎉 Now!</p>
<p class="muted" id="when"></p>
<p class="muted" id="by"></p>
<form class="row" id="set">
  <input id="name" placeholder="What" aria-label="What" maxlength="60">
  <input id="date" type="datetime-local" aria-label="Date and time">
  <button type="submit">Set</button>
</form>
<script>
  // The target is shared: whoever sets it last decides, and everyone counts down to it.
  // Settings: a new app of this kind changes only the SETTINGS line.
  const SETTINGS = {"title":"Release","target":"2026-12-01T09:00"};
  let target = new Date(SETTINGS.target).getTime();
  let label = SETTINGS.title;

  miniapp.on((ev) => {
    const d = ev.data || {};
    if (typeof d.target === "number") {
      target = d.target;
      if (typeof d.label === "string" && d.label) label = d.label;
      document.getElementById("by").textContent = "set by " + miniapp.displayName(ev.sender);
    }
    render();
  });

  document.getElementById("set").onsubmit = (e) => {
    e.preventDefault();
    const when = new Date(document.getElementById("date").value).getTime();
    if (!isNaN(when)) miniapp.send({ target: when, label: document.getElementById("name").value.trim() });
  };

  function render() {
    document.getElementById("title").textContent = label;
    document.getElementById("when").textContent = new Date(target).toLocaleString();
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    const parts = [["days", Math.floor(s / 86400)], ["hours", Math.floor(s / 3600) % 24], ["minutes", Math.floor(s / 60) % 60], ["seconds", s % 60]];
    const left = document.getElementById("left");
    left.hidden = s === 0;
    document.getElementById("done").hidden = s > 0;
    left.textContent = "";
    for (const [unit, n] of parts) {
      const box = document.createElement("div");
      box.className = "card";
      const num = document.createElement("div");
      num.className = "big";
      num.textContent = String(n).padStart(2, "0");
      const small = document.createElement("small");
      small.textContent = unit;
      box.append(num, small);
      left.append(box);
    }
  }

  setInterval(render, 1000);
  miniapp.ready(render);
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shared board</title>
<style>
  .column { min-height: 140px; }
  .column h2 { display: flex; justify-content: space-between; color: var(--muted); }
  .item { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
  .item .row { margin-top: 6px; gap: 2px; }
</style>
</head>
<body>
<h1 id="heading">Shared board</h1>
<form class="row" id="add">
  <input id="text" type="text" placeholder="New card" aria-label="New card" maxlength="200">
  <button type="submit">Add</button>
</form>
<div class="grid" id="board"></div>
<script>
  // Settings: a new app of this kind changes only this line.
  const SETTINGS = {"title":"Shared board","placeholder":"New card","columns":["To do","Doing","Done"]};
  const COLUMNS = SETTINGS.columns;
  document.getElementById("heading").textContent = SETTINGS.title;
  document.getElementById("text").placeholder = SETTINGS.placeholder;
  document.getElementById("text").setAttribute("aria-label", SETTINGS.placeholder);
  const cards = new Map(); // event id -> { text, column, by }

  miniapp.on((ev) => {
    const d = ev.data || {};
    if (typeof d.add === "string") cards.set(ev.id, { text: d.add, column: 0, by: ev.sender });
    if (d.move && cards.has(d.move) && typeof d.column === "number") {
      cards.get(d.move).column = Math.max(0, Math.min(COLUMNS.length - 1, d.column));
    }
    if (d.remove) cards.delete(d.remove);
    render();
  });

  document.getElementById("add").onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById("text");
    const text = input.value.trim();
    if (text) miniapp.send({ add: text });
    input.value = "";
  };

  function button(label, title, onclick) {
    const b = document.createElement("button");
    b.className = "ghost";
    b.textContent = label;
    b.setAttribute("aria-label", title);
    b.onclick = onclick;
    return b;
  }

  function render() {
    const board = document.getElementById("board");
    board.textContent = "";
    COLUMNS.forEach((name, col) => {
      const column = document.createElement("section");
      column.className = "column card";
      const here = [...cards].filter(([, card]) => card.column === col);
      const title = document.createElement("h2");
      const count = document.createElement("span");
      count.className = "badge";
      count.textContent = here.length;
      title.append(name, count);
      column.append(title);
      for (const [id, card] of here) {
        const el = document.createElement("div");
        el.className = "item";
        const text = document.createElement("div");
        text.textContent = card.text;
        const row = document.createElement("div");
        row.className = "row";
        row.append(miniapp.avatar(card.by));
        const gap = document.createElement("span");
        gap.className = "grow";
        row.append(gap);
        if (col > 0) row.append(button("←", "Move " + card.text + " to " + COLUMNS[col - 1], () => miniapp.send({ move: id, column: col - 1 })));
        if (col < COLUMNS.length - 1) row.append(button("→", "Move " + card.text + " to " + COLUMNS[col + 1], () => miniapp.send({ move: id, column: col + 1 })));
        row.append(button("✕", "Remove " + card.text, () => miniapp.send({ remove: id })));
        el.append(text, row);
        column.append(el);
      }
      board.append(column);
    });
  }

  miniapp.ready(render);
</script>
</body>
</html>

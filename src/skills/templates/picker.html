<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Who's next?</title>
<style>
  #result { margin: 20px 0 4px; min-height: 1.2em; }
</style>
</head>
<body class="center">
<h1 id="heading">Who's next?</h1>
<textarea id="choices" aria-label="Choices, one per line">Anna
Bob
Carla</textarea>
<p><button id="pick">Pick one</button></p>
<p class="big appear" id="result"></p>
<p class="muted" id="by"></p>
<script>
  // Settings: a new app of this kind changes only this line.
  const SETTINGS = {"title":"Who's next?","choices":["Anna","Bob","Carla"],"button":"Pick one"};
  document.getElementById("heading").textContent = SETTINGS.title;
  document.getElementById("choices").value = SETTINGS.choices.join("\n");
  document.getElementById("pick").textContent = SETTINGS.button;

  // The draw happens on the clicker's device and is shared, so everyone sees the same result.
  miniapp.on((ev) => {
    const d = ev.data || {};
    if (typeof d.picked === "string") {
      const result = document.getElementById("result");
      result.textContent = "🎲 " + d.picked;
      // Replays the entrance animation for every new pick.
      result.classList.remove("appear");
      void result.offsetWidth;
      result.classList.add("appear");
      document.getElementById("by").textContent = "picked by " + miniapp.displayName(ev.sender) + " from " + d.from + " choices";
    }
  });

  document.getElementById("pick").onclick = () => {
    const choices = document.getElementById("choices").value.split("\n").map((s) => s.trim()).filter(Boolean);
    if (!choices.length) return;
    const picked = choices[Math.floor(Math.random() * choices.length)];
    miniapp.send({ picked, from: choices.length });
  };
</script>
</body>
</html>

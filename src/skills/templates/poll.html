<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lunch poll</title>
<style>
  .option { display: block; width: 100%; margin: 0 0 8px; padding: 10px 12px; text-align: left; }
  .option .row { justify-content: space-between; margin-bottom: 8px; }
  .option.chosen { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
</style>
</head>
<body>
<h1 id="question">Where do we have lunch?</h1>
<div id="options"></div>
<div class="row" id="voters"></div>
<p class="muted" id="who"></p>
<script>
  // Settings: a new app of this kind changes only this line.
  const SETTINGS = {"title":"Lunch poll","question":"Where do we have lunch?","options":["Pizza","Sushi","Salad bar"]};
  const OPTIONS = SETTINGS.options;
  document.getElementById("question").textContent = SETTINGS.question;
  const votes = {}; // user id -> option

  miniapp.on((ev) => {
    if (ev.data && OPTIONS.includes(ev.data.vote)) votes[ev.sender] = ev.data.vote;
    render();
  });

  function render() {
    const total = Object.keys(votes).length;
    const mine = votes[miniapp.user.id];
    const box = document.getElementById("options");
    box.textContent = "";
    for (const option of OPTIONS) {
      const n = Object.values(votes).filter((v) => v === option).length;
      const button = document.createElement("button");
      button.className = "option secondary" + (option === mine ? " chosen" : "");
      button.onclick = () => miniapp.send({ vote: option });
      const top = document.createElement("div");
      top.className = "row";
      const label = document.createElement("span");
      label.textContent = option + (option === mine ? " ✓" : "");
      const count = document.createElement("span");
      count.className = "badge";
      count.textContent = n;
      top.append(label, count);
      const meter = document.createElement("div");
      meter.className = "meter";
      const fill = document.createElement("span");
      fill.style.width = total ? (n / total) * 100 + "%" : "0";
      meter.append(fill);
      button.append(top, meter);
      box.append(button);
    }
    document.getElementById("voters").replaceChildren(...Object.keys(votes).map(miniapp.avatar.bind(miniapp)));
    document.getElementById("who").textContent = total
      ? total + " voted: " + Object.keys(votes).map(miniapp.displayName).join(", ")
      : "No votes yet.";
  }

  miniapp.ready(render);
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<style>
  .rank { width: 1.6em; text-align: center; }
  .score { min-width: 2em; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .list button { min-width: 38px; padding: 0; }
</style>
</head>
<body>
<h1 id="heading">Scoreboard</h1>
<form class="row" id="add">
  <input id="name" placeholder="Player or team" aria-label="Player or team" maxlength="40">
  <button type="submit" aria-label="Add player">＋</button>
</form>
<ul class="list card" id="rows"></ul>
<p class="empty" id="empty">No players yet.</p>
<script>
  // Settings: a new app of this kind changes only this line.
  const SETTINGS = {"title":"Scoreboard","placeholder":"Player or team"};
  document.getElementById("heading").textContent = SETTINGS.title;
  document.getElementById("name").placeholder = SETTINGS.placeholder;
  document.getElementById("name").setAttribute("aria-label", SETTINGS.placeholder);

  const scores = new Map(); // name -> points

  miniapp.on((ev) => {
    const d = ev.data || {};
    if (typeof d.player === "string" && !scores.has(d.player)) scores.set(d.player, 0);
    if (typeof d.player === "string" && typeof d.points === "number") scores.set(d.player, scores.get(d.player) + d.points);
    render();
  });

  document.getElementById("add").onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    if (name) miniapp.send({ player: name });
    document.getElementById("name").value = "";
  };

  function render() {
    const rows = document.getElementById("rows");
    rows.textContent = "";
    rows.hidden = scores.size === 0;
    document.getElementById("empty").hidden = scores.size > 0;
    const sorted = [...scores].sort((a, b) => b[1] - a[1]);
    sorted.forEach(([name, points], i) => {
      const li = document.createElement("li");
      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = ["🥇", "🥈", "🥉"][i] || i + 1;
      const who = document.createElement("span");
      who.className = "grow";
      who.textContent = name;
      const score = document.createElement("span");
      score.className = "score";
      score.textContent = points;
      li.append(rank, who);
      for (const [label, delta] of [["−", -1], ["+", 1]]) {
        const b = document.createElement("button");
        b.className = delta > 0 ? "" : "secondary";
        b.textContent = label;
        b.setAttribute("aria-label", (delta > 0 ? "Add a point for " : "Remove a point from ") + name);
        b.onclick = () => miniapp.send({ player: name, points: delta });
        li.append(b);
        if (delta < 0) li.append(score);
      }
      rows.append(li);
    });
  }

  miniapp.ready(render);
</script>
</body>
</html>

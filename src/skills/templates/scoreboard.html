<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scoreboard</title>
<style>
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  form { display: flex; gap: 8px; margin-bottom: 10px; }
  input { flex: 1; min-height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  button { min-height: 36px; min-width: 36px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); cursor: pointer; font-size: 16px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td.score { font-size: 20px; text-align: center; width: 3em; font-variant-numeric: tabular-nums; }
  td.buttons { width: 6em; text-align: right; }
</style>
</head>
<body>
<h1>Scoreboard</h1>
<form id="add">
  <input id="name" placeholder="Player or team" aria-label="Player or team" maxlength="40">
  <button type="submit" aria-label="Add player">＋</button>
</form>
<table><tbody id="rows"></tbody></table>
<script>
  const scores = new Map(); // name -> points

  miniapp.on((ev) => {
    const d = ev.data || {};
    if (typeof d.player === "string" && !scores.has(d.player)) scores.set(d.player, 0);
    if (typeof d.player === "string" && typeof d.points === "number") scores.set(d.player, scores.get(d.player) + d.points);
    render();
  });

  document.getElementById("add").onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    if (name) miniapp.send({ player: name });
    document.getElementById("name").value = "";
  };

  function render() {
    const rows = document.getElementById("rows");
    rows.textContent = "";
    const sorted = [...scores].sort((a, b) => b[1] - a[1]);
    for (const [name, points] of sorted) {
      const tr = document.createElement("tr");
      const who = document.createElement("td");
      who.textContent = name;
      const score = document.createElement("td");
      score.className = "score";
      score.textContent = points;
      const buttons = document.createElement("td");
      buttons.className = "buttons";
      for (const [label, delta] of [["−", -1], ["+", 1]]) {
        const b = document.createElement("button");
        b.textContent = label;
        b.setAttribute("aria-label", (delta > 0 ? "Add a point for " : "Remove a point from ") + name);
        b.onclick = () => miniapp.send({ player: name, points: delta });
        buttons.append(b, " ");
      }
      tr.append(who, score, buttons);
      rows.append(tr);
    }
  }

  miniapp.ready(render);
</script>
</body>
</html>
